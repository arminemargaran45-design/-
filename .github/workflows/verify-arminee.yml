name: Verify arminee.ru

on:
  workflow_dispatch:
  push:
    branches:
      - arminee-portfolio
    paths:
      - ".github/workflows/verify-arminee.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check public HTTPS portfolio
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code="$(curl -L --connect-timeout 15 --max-time 30 -sS -o /tmp/arminee.html -w '%{http_code}' https://arminee.ru/ || true)"
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ] && grep -qiE 'Армине|Armine|ORVENIXA|MedAlliance|Recovery360' /tmp/arminee.html; then
              echo "VERIFIED: https://arminee.ru returns portfolio content over HTTPS"
              exit 0
            fi
            sleep 10
          done
          echo "Verification failed"
          test -f /tmp/arminee.html && head -c 500 /tmp/arminee.html || true
          exit 1
