name: Verify arminee.ru

on:
  workflow_dispatch:
  push:
    branches:
      - arminee-portfolio
    paths:
      - ".github/workflows/verify-arminee.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check apex, www, content and assets
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            local url="$1"
            local file="$2"
            local code
            code="$(curl -L --connect-timeout 15 --max-time 30 -sS -o "$file" -w '%{http_code}' "$url")"
            echo "$url -> HTTP $code"
            test "$code" = "200"
            grep -qiE 'Армине|Armine|ORVENIXA|MedAlliance|Recovery360' "$file"
          }

          check_page "https://arminee.ru/" "/tmp/apex.html"
          check_page "https://www.arminee.ru/" "/tmp/www.html"

          asset="$(grep -oE '(src|href)="[^"]+\.(css|js)[^"]*"' /tmp/apex.html | head -n1 | sed -E 's/^(src|href)="([^"]+)"/\2/')"
          if [ -n "$asset" ]; then
            case "$asset" in
              http*) asset_url="$asset" ;;
              /*) asset_url="https://arminee.ru$asset" ;;
              *) asset_url="https://arminee.ru/$asset" ;;
            esac
            asset_code="$(curl -L --connect-timeout 15 --max-time 30 -sS -o /dev/null -w '%{http_code}' "$asset_url")"
            echo "$asset_url -> HTTP $asset_code"
            test "$asset_code" = "200"
          fi

          echo "VERIFIED: apex, www, portfolio content and static asset are available over HTTPS"
