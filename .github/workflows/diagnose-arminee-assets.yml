name: Diagnose Timeweb portfolio
on:
  push:
    branches: [diagnose-arminee-assets]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Timeweb directly
        shell: bash
        run: |
          set -u
          echo "=== TIMEWEB ROOT ==="
          curl -k -sSIL --resolve arminee.ru:443:200.169.183.154 https://arminee.ru/ | sed -n '1,40p'
          curl -k -sSL --resolve arminee.ru:443:200.169.183.154 https://arminee.ru/ -o /tmp/timeweb.html
          echo "=== TITLE / ASSETS ==="
          grep -oE '<title>[^<]*</title>|(href|src)="[^"]+\.(css|js)[^"]*"' /tmp/timeweb.html | head -30 || true
          echo "=== CHECK FIRST ASSETS ==="
          grep -oE '(href|src)="[^"]+\.(css|js)[^"]*"' /tmp/timeweb.html | sed -E 's/^(href|src)="([^"]+)"/\2/' | head -8 > /tmp/assets.txt || true
          while read -r asset; do
            [ -z "$asset" ] && continue
            case "$asset" in
              http*) url="$asset" ;;
              /*) url="https://arminee.ru$asset" ;;
              *) url="https://arminee.ru/$asset" ;;
            esac
            echo "--- $url"
            curl -k -sSIL --resolve arminee.ru:443:200.169.183.154 "$url" | grep -Ei 'HTTP/|content-type|content-length|server:' | head -10
          done < /tmp/assets.txt
