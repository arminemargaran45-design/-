name: Inspect old Vercel css refs
on:
  push:
    branches: [diagnose-arminee-assets]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect old css
        shell: bash
        run: |
          set -u
          curl --resolve arminee.ru:443:216.198.79.1 -sSL https://arminee.ru/_next/static/chunks/0fopui53jdou..css -o /tmp/old.css
          echo "CSS SIZE"; wc -c /tmp/old.css
          echo "URL REFS"; grep -oE 'url\([^)]+' /tmp/old.css | head -100 || true
