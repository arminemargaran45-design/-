name: Inspect old Vercel build
on:
  push:
    branches: [diagnose-arminee-assets]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect old origin
        shell: bash
        run: |
          set -u
          curl --resolve arminee.ru:443:216.198.79.1 -sSL https://arminee.ru/ -o /tmp/old.html
          echo "SIZE"; wc -c /tmp/old.html
          echo "TITLE"; grep -oE '<title>[^<]*</title>' /tmp/old.html | head
          echo "NEXT IMAGE"; grep -oE '/_next/image[^" <]+' /tmp/old.html | head -30 || true
          echo "ASSETS"; grep -oE '(src|href)="[^"]+"' /tmp/old.html | sed -E 's/^(src|href)="([^"]+)"/\2/' | grep -E '^/' | head -120
