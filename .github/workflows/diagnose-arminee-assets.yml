name: Diagnose arminee public after DNS switch
on:
  push:
    branches: [diagnose-arminee-assets]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public DNS and assets
        shell: bash
        run: |
          set -u
          echo "=== DNS ==="
          dig +short arminee.ru A || true
          dig +short www.arminee.ru A || true
          echo "=== ROOT ==="
          curl -sSIL https://arminee.ru/ | sed -n '1,40p'
          curl -sSL https://arminee.ru/ -o /tmp/index.html
          echo "=== ASSETS ==="
          grep -oE '(href|src)="[^"]+\.(css|js)[^"]*"' /tmp/index.html | head -20 || true
          grep -oE '(href|src)="[^"]+\.(css|js)[^"]*"' /tmp/index.html | sed -E 's/^(href|src)="([^"]+)"/\2/' | head -8 > /tmp/assets.txt || true
          while read -r asset; do
            [ -z "$asset" ] && continue
            case "$asset" in
              http*) url="$asset" ;;
              /*) url="https://arminee.ru$asset" ;;
              *) url="https://arminee.ru/$asset" ;;
            esac
            echo "--- $url"
            curl -sSIL "$url" | grep -Ei 'HTTP/|content-type|content-length|server:|cache-control' | head -12
          done < /tmp/assets.txt
