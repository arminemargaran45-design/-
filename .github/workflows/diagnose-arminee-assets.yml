name: Diagnose service worker
on:
  push:
    branches: [diagnose-arminee-assets]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search service worker references
        shell: bash
        run: |
          set -u
          curl -sSL https://arminee.ru/ -o /tmp/index.html
          echo "HTML:"
          grep -Eio 'serviceWorker|service-worker|sw\.js|navigator\.serviceWorker' /tmp/index.html | sort -u || true
          grep -oE '(href|src)="[^"]+\.js[^"]*"' /tmp/index.html | sed -E 's/^(href|src)="([^"]+)"/\2/' | sort -u > /tmp/js.txt || true
          while read -r asset; do
            [ -z "$asset" ] && continue
            case "$asset" in
              http*) url="$asset" ;;
              /*) url="https://arminee.ru$asset" ;;
              *) url="https://arminee.ru/$asset" ;;
            esac
            body="/tmp/$(echo "$asset" | tr '/~?&=' '_')"
            curl -sSL "$url" -o "$body" || true
            if grep -Eqi 'serviceWorker|service-worker|sw\.js|navigator\.serviceWorker' "$body"; then
              echo "FOUND IN $url"
              grep -Eio '.{0,80}(serviceWorker|service-worker|sw\.js|navigator\.serviceWorker).{0,120}' "$body" | head -5 || true
            fi
          done < /tmp/js.txt
