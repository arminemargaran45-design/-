name: Verify restored portfolio
on:
  push:
    branches: [diagnose-arminee-assets]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify in clean Chrome
        shell: bash
        run: |
          set -u
          echo "=== DNS ==="
          dig +short arminee.ru A || true
          echo "=== HTTP ==="
          curl -sSIL https://arminee.ru/ | sed -n '1,40p'
          echo "=== CHROME ==="
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 --enable-logging=stderr --v=0 --dump-dom "https://arminee.ru/?restorecheck=1" > /tmp/dom.html 2> /tmp/chrome.log || true
          echo "DOM_BYTES=$(wc -c < /tmp/dom.html)"
          grep -oE '<body[^>]*>|Создаю системы|ORVENIXA|MedAlliance|Styling Wrap Studio|Обо мне|Контакты' /tmp/dom.html | head -50 || true
          echo "=== ERRORS ==="
          grep -Ei 'uncaught|typeerror|referenceerror|syntaxerror|failed to load|chunkload|hydration|net::ERR|404|stylesheet' /tmp/chrome.log | tail -100 || true
