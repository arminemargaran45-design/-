<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#f7f3e8"/><meta name="description" content="БудуБуду — игра, в которой ребенок создает персонажа, изучает профессии и строит свой город"/>
<title>БудуБуду — 3D редактор персонажей</title><style>
:root {
  --ink: #24314a;
  --muted: #667187;
  --cream: #f7f3e8;
  --paper: #fffdf8;
  --blue: #8ec5e8;
  --blue-dark: #315f80;
  --green: #87c7a7;
  --yellow: #f2c75c;
  --coral: #ed8b75;
  --violet: #a99bdd;
  --line: rgba(36, 49, 74, 0.12);
  --shadow: 0 18px 45px rgba(36, 49, 74, 0.13);
  font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 0%, rgba(142, 197, 232, .45), transparent 34%),
    radial-gradient(circle at 96% 12%, rgba(242, 199, 92, .36), transparent 28%),
    var(--cream);
  min-height: 100vh;
}

button, input, select { font: inherit; }
button { color: inherit; }

.shell { min-height: 100vh; padding-bottom: 92px; }
.page { width: min(1120px, calc(100% - 28px)); margin: 0 auto; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  padding: max(14px, env(safe-area-inset-top)) 0 12px;
  backdrop-filter: blur(18px);
  background: rgba(247, 243, 232, .82);
  border-bottom: 1px solid rgba(36, 49, 74, .08);
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; }
.brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 15px; background: var(--ink); color: white; font-size: 22px; transform: rotate(-3deg); }
.brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; }
.profile-pill { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--paper); border-radius: 18px; padding: 7px 10px; box-shadow: 0 8px 20px rgba(36,49,74,.07); }
.avatar-mini { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #dceeff; font-size: 20px; }

.hero { padding: 28px 0 16px; display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; align-items: stretch; }
.hero-copy, .hero-status, .panel, .card { background: rgba(255,253,248,.91); border: 1px solid var(--line); box-shadow: var(--shadow); }
.hero-copy { padding: clamp(24px, 5vw, 52px); border-radius: 36px; position: relative; overflow: hidden; }
.hero-copy::after { content: ""; position: absolute; width: 180px; height: 180px; right: -45px; bottom: -75px; border-radius: 52px; background: var(--yellow); transform: rotate(18deg); opacity: .45; }
.eyebrow { color: var(--blue-dark); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 900; }
h1 { font-size: clamp(34px, 7vw, 70px); line-height: .98; letter-spacing: -.055em; margin: 12px 0 16px; max-width: 760px; }
h2 { font-size: clamp(24px, 4vw, 38px); letter-spacing: -.035em; margin: 0 0 8px; }
h3 { margin: 0 0 7px; font-size: 19px; }
p { line-height: 1.55; }
.lead { color: var(--muted); font-size: 17px; max-width: 660px; }
.hero-status { border-radius: 36px; padding: 24px; display: grid; gap: 12px; background: var(--ink); color: white; }
.status-number { font-size: 52px; font-weight: 900; letter-spacing: -.04em; }
.status-caption { color: #d6e0ef; font-size: 13px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; position: relative; z-index: 1; }
.btn { border: 0; border-radius: 17px; min-height: 50px; padding: 12px 18px; font-weight: 900; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--ink); color: white; box-shadow: 0 10px 26px rgba(36,49,74,.22); }
.btn-soft { background: #edf4f8; color: var(--blue-dark); }
.btn-coral { background: var(--coral); color: white; }
.btn-block { width: 100%; }

.section { padding: 18px 0; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 14px; }
.section-head p { margin: 0; color: var(--muted); }
.grid { display: grid; gap: 14px; }
.profession-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.profession-card { padding: 20px; border-radius: 27px; cursor: pointer; position: relative; overflow: hidden; min-height: 220px; transition: transform .18s ease; }
.profession-card:hover { transform: translateY(-3px); }
.profession-card .icon { font-size: 52px; }
.profession-card.doctor { background: #e4f3ec; }
.profession-card.firefighter { background: #fee9e3; }
.profession-card.builder { background: #fff1c9; }
.progress { height: 10px; border-radius: 99px; background: rgba(36,49,74,.1); overflow: hidden; margin: 14px 0 7px; }
.progress > span { display: block; height: 100%; background: var(--ink); border-radius: inherit; transition: width .4s ease; }
.tag { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,.72); border: 1px solid rgba(36,49,74,.08); padding: 6px 9px; border-radius: 99px; font-size: 11px; font-weight: 900; }

.city-map { min-height: 420px; border-radius: 34px; padding: 22px; background: linear-gradient(#bfe3f3 0 31%, #dcefcf 31%); border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.city-map::before { content: ""; position: absolute; inset: 50% -10% auto; height: 74px; background: #d9d4c9; transform: rotate(-4deg); border-block: 9px solid #f4f0e7; }
.sun { position: absolute; right: 30px; top: 28px; width: 54px; height: 54px; background: var(--yellow); border-radius: 50%; box-shadow: 0 0 0 13px rgba(242,199,92,.18); }
.city-grid { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: end; min-height: 360px; }
.building { border: 2px dashed rgba(36,49,74,.28); background: rgba(255,255,255,.58); min-height: 190px; border-radius: 25px; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center; }
.building.ready { border-style: solid; background: rgba(255,253,248,.9); }
.building-emoji { font-size: 70px; filter: drop-shadow(0 12px 10px rgba(36,49,74,.15)); }
.building small { color: var(--muted); }

.task-wrap { display: grid; grid-template-columns: .8fr 1.2fr; gap: 16px; align-items: start; }
.task-visual { min-height: 330px; border-radius: 32px; background: var(--blue); display: grid; place-items: center; font-size: 120px; box-shadow: var(--shadow); }
.task-panel { border-radius: 32px; padding: 26px; }
.choice-list { display: grid; gap: 10px; margin: 18px 0; }
.choice { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 18px; padding: 14px 16px; cursor: pointer; font-weight: 800; }
.choice:hover, .choice.selected { border-color: var(--blue-dark); background: #edf6fb; }
.feedback { border-radius: 18px; padding: 14px; margin-top: 12px; background: var(--yellow); font-weight: 800; }
.feedback.good { background: #d9f0df; }

.onboarding { min-height: 100vh; display: grid; place-items: center; padding: 26px 14px; }
.onboarding-card { width: min(760px, 100%); background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 38px; padding: clamp(24px, 6vw, 54px); }
.step-dots { display: flex; gap: 6px; margin-bottom: 22px; }
.step-dots span { width: 32px; height: 7px; background: #dfe4e8; border-radius: 99px; }
.step-dots span.active { background: var(--ink); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 800; }
input, select { width: 100%; border: 2px solid var(--line); border-radius: 16px; padding: 14px; background: white; color: var(--ink); outline: none; }
input:focus, select:focus { border-color: var(--blue-dark); }
.avatar-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 22px; }
.avatar-option { width: 64px; height: 64px; border: 2px solid transparent; background: #edf4f8; border-radius: 22px; font-size: 34px; cursor: pointer; }
.avatar-option.selected { border-color: var(--ink); transform: rotate(-3deg); }

.bottom-nav { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); width: min(560px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(36,49,74,.94); backdrop-filter: blur(16px); border-radius: 23px; padding: 7px; box-shadow: 0 18px 40px rgba(36,49,74,.28); }
.nav-btn { border: 0; border-radius: 17px; background: transparent; color: #d7deea; padding: 9px 5px; font-size: 11px; font-weight: 800; cursor: pointer; }
.nav-btn span { display: block; font-size: 20px; margin-bottom: 2px; }
.nav-btn.active { background: white; color: var(--ink); }

.modal-backdrop { position: fixed; z-index: 80; inset: 0; background: rgba(20,29,45,.58); display: grid; place-items: center; padding: 16px; }
.modal { width: min(520px, 100%); max-height: 88vh; overflow: auto; border-radius: 30px; padding: 26px; background: var(--paper); box-shadow: var(--shadow); }
.reward { text-align: center; }
.reward-icon { font-size: 90px; animation: pop .5s ease both; }
@keyframes pop { from { transform: scale(.3) rotate(-15deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.parent-list { display: grid; gap: 11px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid var(--line); }
.notice { background: #fff5d8; border-left: 4px solid var(--yellow); border-radius: 14px; padding: 12px 14px; color: #5b4a1a; }

@media (max-width: 760px) {
  .hero, .task-wrap { grid-template-columns: 1fr; }
  .hero-status { grid-template-columns: 1fr 1fr; }
  .profession-grid { grid-template-columns: 1fr; }
  .profession-card { min-height: 170px; }
  .city-grid { grid-template-columns: 1fr 1fr; }
  .building { min-height: 155px; }
  .form-grid { grid-template-columns: 1fr; }
}

@media (max-width: 420px) {
  .page { width: min(100% - 20px, 1120px); }
  .brand small { display: none; }
  .profile-pill strong { display: none; }
  .hero-copy, .hero-status, .task-panel { border-radius: 26px; }
  .city-map { padding: 12px; border-radius: 26px; }
  .city-grid { gap: 8px; }
  .building { padding: 9px; }
  .building-emoji { font-size: 54px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* БудуБуду • дружелюбный редактор, адаптированный для телефона и планшета */
.avatar-editor-shell { width:min(1120px,calc(100% - 26px));margin:0 auto;padding:32px 0 110px; }
.avatar-first{padding:23px 0 38px;}
.avatar-headline{text-align:center;margin-bottom:21px;}
.avatar-headline h1{font-size:clamp(39px,6vw,66px);max-width:none;margin:8px 0 9px;color:#26344C;letter-spacing:-.065em;}
.avatar-headline p{font-size:16px;color:#637188;margin:0 auto;max-width:600px;}
.avatar-studio{display:grid;grid-template-columns:minmax(280px,.88fr) minmax(380px,1.12fr);gap:19px;align-items:start;}
.avatar-preview-area,.avatar-controls{border-radius:34px;background:#FFFDF8;border:1px solid rgba(70,78,88,.12);box-shadow:0 17px 48px rgba(36,49,74,.1);overflow:hidden;}
.avatar-preview-area{padding:16px;background:linear-gradient(160deg,#FDF0E4,#E5F4F3 95%);position:sticky;top:96px;}
.avatar-stage{height:455px;border-radius:29px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 49% 32%,#fff 0%,#fffefbcc 35%,#F4E5DC77 74%);}
.avatar-stage:before{content:'';position:absolute;inset:24px 20px 34px;border-radius:50%;border:6px dashed rgba(255,255,255,.65);}
.character-svg{width:min(100%,340px);height:100%;object-fit:contain;filter:drop-shadow(0 5px 3px rgba(43,60,82,.08));position:relative;z-index:2;}
.avatar-stage .character-svg{height:100%;width:100%;max-width:340px;}
.avatar-stage-star{position:absolute;z-index:1;color:#F2BC65;font-size:40px;}
.star-left{top:24%;left:8%;}.star-right{top:13%;right:12%;font-size:52px;color:#D899AE;}
.avatar-stage-shadow{position:absolute;bottom:18px;left:34%;right:34%;background:#647D8D15;height:17px;border-radius:50%;}
.avatar-stage-hint{text-align:center;color:#60738A;font-size:13px;font-weight:900;margin:10px 0 13px;}
.gender-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gender-switch button{min-height:61px;background:#fff;border:2px solid #DFE8E9;border-radius:17px;font-weight:900;font-size:15px;cursor:pointer;}
.gender-switch button.selected{background:#fff6e9;border-color:#E6AB57;box-shadow:0 5px 15px #E6AB5725;}
.avatar-controls{padding:18px;}
.avatar-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}
.avatar-tab{min-width:0;min-height:65px;border:2px solid transparent;border-radius:15px;background:#F3F4F4;cursor:pointer;font-size:11px;font-weight:850;color:#546176;padding:7px 2px;}
.avatar-tab span{display:block;font-size:25px;line-height:1.2;margin-bottom:4px;}
.avatar-tab.selected{background:#FFEED3;border-color:#E5AD62;color:#28354C;}
.avatar-choices{border-radius:21px;background:#FBF9F6;border:1px solid #F0E8DF;padding:17px;margin-top:16px;min-height:206px;}
.avatar-choices h3{margin:7px 0 11px;font-size:21px;}
.avatar-choices h3:not(:first-of-type){margin-top:20px;}
.avatar-choices p{font-size:13px;color:#718091;margin:0 0 14px;}
.avatar-palette{display:flex;flex-wrap:wrap;gap:12px;padding:5px 0 11px;}
.palette-chip{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:transparent;cursor:pointer;padding:3px;}
.palette-chip span{display:block;width:100%;height:100%;border-radius:50%;background:var(--swatch);border:1px solid #00000010;box-shadow:0 2px 5px #00000015;}
.palette-chip.selected{border-color:#335C89;box-shadow:0 0 0 2px #fff inset;transform:scale(1.08);}
.avatar-option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.avatar-detail{border:2px solid #e6e8e7;background:#fff;border-radius:17px;min-height:76px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:12px;}
.avatar-detail>span{font-size:25px;min-height:28px;}
.avatar-detail strong{font-size:12px;line-height:1.15;}
.avatar-detail.selected{border-color:#E4A85F;background:#FFF1DA;}
.avatar-detail.is-locked{opacity:.53;cursor:not-allowed;}
.avatar-detail small{font-size:9px;line-height:1.2;text-align:center;}
.avatar-editor-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin-top:16px;}
.avatar-editor-actions .btn{padding-left:8px;padding-right:8px;}
.avatar-privacy{text-align:center;font-size:11px;color:#87919A;margin:13px 0 2px;}
.onboard-avatar{height:210px;margin:-10px auto 10px;display:flex;justify-content:center;background:#E9F4F4;border-radius:20px;max-width:260px;}
.onboard-avatar .character-svg{width:170px;}
.avatar-mini{overflow:hidden;position:relative;}
.avatar-mini .character-mini{position:absolute;width:85px;height:130px;max-width:none;top:-39px;left:-26px;filter:none;}
.city-character-spot{position:absolute;z-index:5;bottom:6px;left:12px;}
.city-character-button{display:flex;align-items:center;flex-direction:column;border:0;background:none;cursor:pointer;min-width:126px;}
.city-character-button .city-character{height:220px;width:142px;filter:drop-shadow(2px 10px 5px #40516C2c);}
.city-character-label{margin-top:-17px;position:relative;background:#fff;border:2px solid #E5C58E;padding:7px 13px;border-radius:99px;font-weight:900;font-size:11px;box-shadow:0 4px 10px #00000012;}
.city-map{min-height:500px;padding-bottom:105px;}
.city-grid{min-height:350px;}
@media (min-width:800px){.city-character-spot{bottom:6px;left:36px;}.avatar-first{padding-top:37px;}}
@media (max-width:780px){.avatar-studio{grid-template-columns:minmax(0,1fr);}.avatar-preview-area{position:static;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;padding:11px;}.avatar-stage{height:275px;}.avatar-stage-hint{grid-column:1/-1;margin:0 0 3px;}.gender-switch{grid-template-columns:1fr;min-width:130px;}.avatar-tabs{grid-template-columns:repeat(5,minmax(0,1fr));}.avatar-editor-shell{padding-top:17px;}.avatar-headline p{font-size:13px;}.avatar-headline{margin-bottom:14px;}}
@media (max-width:440px){.avatar-editor-shell{width:calc(100% - 16px);}.avatar-preview-area,.avatar-controls{border-radius:23px;}.avatar-controls{padding:10px;}.avatar-stage{height:247px;}.gender-switch{min-width:113px;}.gender-switch button{font-size:12px;min-height:52px;padding:3px;}.avatar-stage-hint{font-size:11px;}.avatar-tab{min-height:61px;font-size:10px;}.avatar-tab span{font-size:22px;}.avatar-choices{padding:13px;min-height:165px;}.avatar-option-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}.avatar-detail strong{font-size:11px;}.palette-chip{width:40px;height:40px;}.avatar-editor-actions{grid-template-columns:1fr;}.avatar-editor-actions .btn{min-height:53px;}.city-character-button .city-character{width:105px;height:175px;}.city-character-label{font-size:10px;}.city-map{padding-bottom:118px;min-height:440px;}.city-character-spot{left:1px;bottom:0px;}.avatar-headline h1{font-size:40px;}}

/* Персонаж — самостоятельная четвёртая ячейка города, не перекрывает здания */
.city-map{padding-bottom:24px;min-height:420px;}
.city-grid{grid-template-columns:repeat(4,minmax(0,1fr));min-height:350px;align-items:end;}
.city-character-spot{position:relative;bottom:auto;left:auto;display:grid;place-items:end center;min-width:0;min-height:190px;z-index:5;}
.city-character-button{width:100%;min-width:0;}
.city-character-button .city-character{height:230px;width:160px;max-width:100%;}
@media(max-width:760px){.city-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}.city-character-spot{min-height:165px;}}
@media(max-width:440px){.city-map{padding-bottom:12px;min-height:440px;}.city-character-button .city-character{height:178px;width:110px;}.city-character-spot{min-height:164px;}.city-character-label{margin-top:-13px;}}
/* Мини-игры вместо вопросов */
.arcade-section-head{align-items:center;}
.arcade-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:17px;}
.arcade-playground{position:relative;min-height:410px;border-radius:30px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(#C2E9FF 0 57%,#B5DDAE 57% 100%);box-shadow:var(--shadow);}
.arcade-playground:after{content:"";position:absolute;bottom:21%;left:-10%;right:-10%;height:19px;background:#FFF6C6;border-radius:99px;}
.arcade-doctor{background:linear-gradient(#E3F5FA 0 77%,#C4E5D4 77%);}
.arcade-firefighter{background:linear-gradient(#BEE4F4 0 57%,#DDD0BA 57%);}
.arcade-builder{background:linear-gradient(#D4EEFC 0 60%,#C8E4B5 60%);}
.arcade-large{position:relative;z-index:2;font-size:130px;margin-top:-65px;filter:drop-shadow(0 12px 5px rgba(0,0,0,.1));}
.arcade-sign{position:absolute;z-index:4;top:18px;left:18px;padding:10px 13px;border-radius:14px;background:#fff;font-size:13px;font-weight:900;box-shadow:0 3px 6px #00000013;}
.arcade-counter{position:absolute;z-index:4;right:18px;top:18px;padding:9px 15px;background:#fff;border-radius:99px;font-weight:900;}
.arcade-character{position:absolute;z-index:3;bottom:15px;left:2%;height:200px;width:140px;}
.arcade-character-svg{height:100%;width:100%;}
.arcade-task-panel{border-radius:30px;padding:23px;}
.arcade-task-panel h2{font-size:25px;line-height:1.15;margin:19px 0;}
.arcade-progress-track{height:13px;background:#DEE4E6;border-radius:99px;overflow:hidden;margin:14px 0 20px;}
.arcade-progress-track span{display:block;height:100%;border-radius:99px;background:#80BFA4;transition:width .3s;}
.arcade-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.arcade-item{border:2px solid #E2E7EA;background:#FFF;border-radius:19px;min-height:111px;padding:10px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;}
.arcade-item:active{transform:scale(.96)}
.arcade-item-icon{font-size:38px;}
.arcade-item strong{font-size:12px;text-align:center;line-height:1.15;}
.arcade-item.done{background:#DFF2E6;border-color:#7EBB9F;}
.arcade-hint{animation:shakeGame .3s ease;}
@keyframes shakeGame{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.arcade-message{margin-top:18px;border-radius:14px;padding:13px;background:#FFF1C9;font-size:15px;font-weight:900;text-align:center;}

  const ax=coords[a],ay=coords[a+1],bx=coords[b],by=coords[b+1],cx=coords[c],cy=coords[c+1];

    const k0=((by-cy)*(px-cx)+(cx-bx)*(py-cy))*inv;

    data[rgba+2]=k0*lightCol[a+2]+k1*lightCol[b+2]+k2*lightCol[c+2];

}

function finishBuilds() {
  let changed = false;
  Object.values(state.buildings).forEach(b => {
    if (b.finishAt && Date.now() >= b.finishAt) { b.finishAt = null; b.stage = Math.max(1, b.stage); changed = true; }

}

 const total=task.items.length;
 const stageDetail=id==='doctor'?'<div class="arcade-large">🧸</div><div class="arcade-sign">Клиника добрых дел</div>':id==='firefighter'?'<div class="arcade-large">🚒</div><div class="arcade-sign">Игрушечная улица</div>':`<div class="arcade-large">${completed.includes('roof')?'🏠':completed.includes('walls')?'🏡':completed.includes('base')?'🧱':'🏗️'}</div><div class="arcade-sign">Строим вместе</div>`;
 return `<main class="page"><section class="section"><div class="section-head arcade-section-head"><div><div class="eyebrow">Интерактивная мини-игра</div><h2>${task.title}</h2></div><button class="btn btn-soft" data-view="professions">← Профессии</button></div><div class="arcade-layout"><div class="arcade-playground arcade-${id}">${stageDetail}<div class="arcade-character">${avatarSVG(state.child.character||DEFAULT_CHARACTER,'arcade-character-svg')}</div><div class="arcade-counter">⭐ ${completed.length} / ${total}</div></div><section class="panel arcade-task-panel"><div class="tag">${professions[id].icon} ${professions[id].title} · игра без вопросов</div><h2>${task.intro}</h2><div class="arcade-progress-track"><span style="width:${completed.length/total*100}%"></span></div><div class="arcade-items">${task.items.map(([item,icon,label])=>`<button class="arcade-item ${completed.includes(item)?'done':''}" data-arcade-item="${item}" ${completed.includes(item)?'disabled':''} aria-label="${label}: ${completed.includes(item)?'готово':'нажать'}"><span class="arcade-item-icon">${completed.includes(item)?'✅':icon}</span><strong>${label}</strong></button>`).join('')}</div><div class="arcade-message">${completed.length===0?'🎮 Нажимай на картинки!':completed.length===total-1?'🌟 Ещё чуть-чуть!':'👏 Отлично получается!'}</div><p class="arcade-safe">${id==='firefighter'?'В настоящей опасности нужно отойти и позвать взрослого.':'Можно играть в своём темпе, без таймера и штрафов.'}</p></section></div></section></main>`;
}

function renderParent() {
  const counts=Object.fromEntries(Object.keys(professions).map(id=>[id,state.professionProgress[id]||0]));
  return `<main class="page"><section class="hero"><div class="hero-copy"><div class="eyebrow">Только для взрослого</div><h1>Спокойный отчёт</h1><p class="lead">Никаких диагнозов и ярлыков. Только то, что ребёнок выбирал и что успел построить.</p></div><aside class="hero-status"><div><div class="status-number">${state.child.age}</div><div class="status-caption">возрастной режим</div></div><div><div class="status-number">${state.stars}</div><div class="status-caption">получено звёзд</div></div></aside></section><section class="panel" style="border-radius:32px;padding:26px"><h2>Интересы за время игры</h2><div class="parent-list">${Object.entries(professions).map(([id,p])=>`<div class="setting-row"><span>${p.icon} ${p.title}</span><strong>${counts[id]} заданий</strong></div>`).join("")}<div class="setting-row"><span>Возрастная подача</span><strong>${ageLabel(state.child.age)}</strong></div><div class="setting-row"><span>Семейная миссия</span><strong>${state.familyMissionDone?"выполнена":"ещё нет"}</strong></div></div><div class="notice" style="margin-top:18px">Прототип хранит прогресс только в браузере этого устройства.</div><div class="actions"><button class="btn btn-soft" data-view="avatar">👕 Изменить персонажа</button><button class="btn btn-coral" data-action="reset">Начать заново</button></div></section></main>`;
}

function bottomNav() {
  const items=[['city','🏙️','Город'],['avatar','🧒','Мой герой'],['professions','🧰','Профессии'],['parent','👨‍👩‍👧','Взрослым']];
  return `<nav class="bottom-nav" aria-label="Основная навигация">${items.map(([v,i,t])=>`<button class="nav-btn ${state.currentView===v?"active":""}" data-view="${v}"><span>${i}</span>${t}</button>`).join("")}</nav>`;
}

function renderModal() {
  if (!state.modal) return "";
  if (state.modal.type==='reward') {
    const p=professions[state.modal.profession];
    return `<div class="modal-backdrop"><section class="modal reward"><div class="reward-icon">${p.rewardIcon}</div><div class="eyebrow">Новая возможность</div><h2>${p.reward}</h2><p>Теперь можно начать строительство: ${p.building.toLowerCase()}.</p><p>👕 Открыт новый наряд в редакторе персонажа!</p><button class="btn btn-primary btn-block" data-action="start-build">Начать строительство</button><button class="btn btn-soft btn-block" style="margin-top:8px" data-action="close-modal">Позже</button></section></div>`;
  }
  if (state.modal.type==='family') return `<div class="modal-backdrop"><section class="modal"><div class="eyebrow">Семейная миссия</div><h2>Наводим порядок вместе</h2><p>Выберите дома пять вещей и вместе найдите каждой своё место. Опасные и тяжёлые предметы убирает только взрослый.</p><div class="notice">Игра предлагает отложить экран и сделать маленькое настоящее дело вместе.</div><div class="actions"><button class="btn btn-primary" data-action="complete-family">Мы сделали!</button><button class="btn btn-soft" data-action="close-modal">Не сейчас</button></div></section></div>`;
  return "";
}

function bindEvents() {
  document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.currentView=el.dataset.view;if(state.currentView==='avatar'){characterDraft=normalizeCharacter(state.child.character);characterCategory='skin';}selectedChoice=null;save();window.scrollTo(0,0);render();});
  document.querySelectorAll('[data-profession]').forEach(el=>el.onclick=()=>{state.selectedProfession=el.dataset.profession;if(!state.onboarded){return;}state.currentView='task';selectedChoice=null;save();render();});
  document.querySelectorAll('[data-avatar-category]').forEach(el=>el.onclick=()=>{
    characterCategory=el.dataset.avatarCategory;
    const y=window.scrollY; render(); window.scrollTo(0,y);
  });
  document.querySelectorAll('[data-character-field]').forEach(el=>el.onclick=()=>{
   const field=el.dataset.characterField, value=el.dataset.characterValue;
   if(field==='outfit' && !characterUnlocked(value)) return;
   if(field==='gender'){const skin=characterDraft.skin;characterDraft=normalizeCharacter({...((value==='boy')?BOY_BASE:GIRL_BASE),skin});}
   else characterDraft[field]=['skin','eyeColor','hairColor','outfitColor','bottomColor','shoeColor'].includes(field)?Number(value):value;
   const y=window.scrollY;render();window.scrollTo(0,y);
  });
  document.querySelectorAll('[data-arcade-item]').forEach(el=>el.onclick=()=>{
   const id=state.selectedProfession,item=el.dataset.arcadeItem;
   const task=ARCADE_TASKS[id];
   if(!task.items.some(x=>x[0]===item)) return;
   let arr=Array.isArray(state.arcadeProgress[id])?[...state.arcadeProgress[id]]:[];
   if(arr.includes(item)) return;
   // Стройка должна идти снизу вверх.
   if(id==='builder' && item!==task.items[arr.length]?.[0]){el.classList.add('arcade-hint');setTimeout(()=>el.classList.remove('arcade-hint'),500);return;}
   arr.push(item);
   state.arcadeProgress[id]=arr;
   if(arr.length===task.items.length){
    state.arcadeProgress[id]=[];
    state.professionProgress[id]=(state.professionProgress[id]||0)+1;
    state.rewards.push({profession:id,type:'blueprint'});
    state.stars++;state.modal={type:'reward',profession:id};
   }
   save();render();
  });
  document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));
}

function action(name) {
  if (name==='onboarding-next') {
    if (onboardingStep===1) {
      onboardingDraft.name=(document.querySelector('#childName')?.value||'Юный герой').trim();
      onboardingDraft.age=+(document.querySelector('#childAge')?.value||4);
    }
    if(onboardingStep===1){characterDraft=normalizeCharacter(onboardingDraft.character);characterCategory='skin';}onboardingStep=Math.min(3,onboardingStep+1); render(); return;
  }
  if (name==='onboarding-back') { onboardingStep=Math.max(1,onboardingStep-1);characterDraft=normalizeCharacter(onboardingDraft.character);render(); return; }
  if (name==='finish-onboarding') { state.onboarded=true; state.child={...onboardingDraft,character:normalizeCharacter(onboardingDraft.character)}; state.currentView='city'; save(); window.scrollTo(0,0);render(); return; }
  if(name==='save-character') {
    if(!characterUnlocked(characterDraft.outfit)) characterDraft.outfit='casual';
    if(!state.onboarded){onboardingDraft.character=normalizeCharacter(characterDraft);onboardingDraft.avatar=characterDraft.gender==='boy'?'👦':'👧';onboardingStep=3;}
    else{state.child.character=normalizeCharacter(characterDraft);state.child.avatar=characterDraft.gender==='boy'?'👦':'👧';state.currentView='city';save();}
    window.scrollTo(0,0);render();return;
  }
  if(name==='random-character'){randomCharacter();render();return;}
  if (name==='check-answer') {
    const id=state.selectedProfession, q=professions[id].questions[ageMode(state.child.age)];
    if (selectedChoice===q.answer) {
      state.professionProgress[id]=(state.professionProgress[id]||0)+1;
      state.rewards.push({profession:id,type:'blueprint'});
      state.stars+=1; state.modal={type:'reward',profession:id}; save(); render();
    } else {
      const panel=document.querySelector('.task-panel');
      panel.insertAdjacentHTML('beforeend','<div class="feedback">Попробуем ещё раз. Подумай, что будет безопаснее и удобнее.</div>');
    }
    return;
  }
  if (name==='start-build') {
    const id=state.modal.profession;
    state.buildings[id].finishAt=Date.now()+30000;
    state.rewards=state.rewards.filter((r,i)=>!(r.profession===id && i===state.rewards.findIndex(x=>x.profession===id)));
    state.modal=null; state.currentView='city'; save(); render(); return;
  }
  if (name==='close-modal') { state.modal=null; save(); render(); return; }
  if (name==='family-mission') { state.modal={type:'family'}; render(); return; }
  if (name==='complete-family') { if(!state.familyMissionDone){state.stars+=1;} state.familyMissionDone=true; state.modal=null; save(); render(); return; }
  if (name==='reset' && confirm('Удалить прогресс прототипа и начать заново?')) { localStorage.removeItem(STORAGE_KEY); state=structuredClone(defaultState); onboardingStep=1; onboardingDraft={name:'',age:4,avatar:'🧒',character:null}; characterDraft=null;render(); }
}

setInterval(()=>{ if(state.onboarded && Object.values(state.buildings).some(b=>b.finishAt)) render(); },1000);
render();

</script></body></html>
